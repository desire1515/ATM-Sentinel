<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111F" />
    <meta
      name="description"
      content="ATM SENTINEL — Malawi-focused ATM monitoring prototype using separately attributed Izmir research data. No live bank connection."
    />
    <script>
      try {
        const preferences = JSON.parse(localStorage.getItem('atm-sentinel:preferences') || '{}')
        document.documentElement.dataset.theme = preferences.darkMode === false ? 'light' : 'dark'
        document.documentElement.dataset.compact = String(preferences.compactMode === true)
        document.documentElement.style.colorScheme = preferences.darkMode === false ? 'light' : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
        document.documentElement.dataset.compact = 'false'
        document.documentElement.style.colorScheme = 'dark'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ATM SENTINEL — Malawi ATM Monitoring Prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
